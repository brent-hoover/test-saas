[project]
name = "test-saas"
version = "0.1.0"
description = "Minimal web app that stands in for a real SaaS product when validating OIDC login."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.0",
    "pyjwt[crypto]>=2.15.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "archunitpython>=1.8.1",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-bdd>=9.0.1",
    "pytest-gremlins>=1.13.2",
    "ruff>=0.17.4",
    "ty>=0.0.99",
]
