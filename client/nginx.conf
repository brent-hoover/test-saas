server {
    # nginx-unprivileged cannot bind ports below 1024.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;

    # Rendered at container start by render-config.sh; never cache it, so a
    # redeploy with new settings takes effect on the next page load.
    location = /config.js {
        alias /tmp/test-saas/config.js;
        default_type application/javascript;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri /index.html;
    }
}
