{{- $component := dict "root" . "component" "api" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "test-saas.componentName" $component }}
  labels:
    {{- include "test-saas.labels" $component | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "test-saas.selectorLabels" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "test-saas.labels" $component | nindent 8 }}
    spec:
      securityContext:
        {{- include "test-saas.podSecurityContext" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "test-saas.image" (dict "root" . "image" .Values.api.image) }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          env:
            - name: OIDC_ISSUER_URL
              value: {{ required "oidc.issuerUrl is required" .Values.oidc.issuerUrl | quote }}
            - name: OIDC_AUDIENCE
              value: {{ required "oidc.audience is required" .Values.oidc.audience | quote }}
          ports:
            - name: http
              containerPort: 8000
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
          readinessProbe:
            httpGet:
              path: /api/readyz
              port: http
          securityContext:
            {{- include "test-saas.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "test-saas.componentName" $component }}
  labels:
    {{- include "test-saas.labels" $component | nindent 4 }}
spec:
  selector:
    {{- include "test-saas.selectorLabels" $component | nindent 4 }}
  ports:
    # Port name prefix "http" tells Istio the protocol.
    - name: http
      port: 80
      targetPort: http
